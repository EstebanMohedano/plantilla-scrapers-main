version: '3.8'

services:
  scraper:
    build:
      context: .
      dockerfile: Dockerfile.scrapers
    container_name: scraper
    ports:
      - "5900:5900"   # VNC
      - "9222:9222"   # Chrome DevTools Protocol
    env_file:
      - .env
    environment:
      - VNC_PASSWORD=${VNC_PASSWORD:-scraper}
      - GOOGLE_EMAIL=${GOOGLE_EMAIL}
      - GOOGLE_PASSWORD=${GOOGLE_PASSWORD}
      - HOLDED_EMAIL=${HOLDED_EMAIL:-}
      - HOLDED_PASSWORD=${HOLDED_PASSWORD:-}
      - HOLDED_OTP=${HOLDED_OTP:-}
      - HOLDED_HEADLESS=${HOLDED_HEADLESS:-false}
    volumes:
      - ./data:/app/data       # datos persistentes (cookies, perfiles, outputs)
    shm_size: 2gb
    restart: unless-stopped
    networks:
      - coolify

networks:
  coolify:
    external: true
    name: coolify
